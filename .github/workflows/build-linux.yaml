name: "linux tests and package builds for 'berlin_events_explorer'"
# This workflow is triggered on pushes to the repository.
on: [push]

jobs:

  commitlint:
    name: lint commit message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  test-linux:
    name: pytest on linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ariga/setup-atlas@v0
      - uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ matrix.python_version }}
      - name: validate Atlas migration history
        run: atlas migrate validate --dir file://src/berlin_events_explorer/db_migrations
      - name: test with pytest
        run: uv run pytest --cov-report=xml --cov=berlin_events_explorer tests

  type-check-linux:
    name: type check on linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
        with:
          python-version: ${{ matrix.python_version }}
      - name: run type-checker
        run: make typecheck

  linting-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
      - name: Run ruff check
        run: uv run ruff check --no-fix --select E4,E7,E9,F src/
      - name: Run ruff format check
        run: uv run ruff format --check --diff src/

  build_python_package:
    name: build python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv-env
      - name: create packages
        run: uv run python -m build
      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-dists
          path: dist/

  release_python_package:
    name: publish python package to pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs:
      - test-linux
      - type-check-linux
      - linting-linux
      - build_python_package
    permissions:
      id-token: write
    steps:
      - name: Retrieve build distributions
        uses: actions/download-artifact@v7
        with:
          name: build-dists
          path: dist/
      - name: publish to PyPI  # make sure you have pypi trusted publishing configured for this repo: https://docs.pypi.org/trusted-publishers/
        uses: pypa/gh-action-pypi-publish@release/v1


  merge_tag_to_main:
    name: merge current tag to main branch
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: write
      actions: write
    needs:
      - release_python_package
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - run: git config --global user.email "markus@frkl.dev"
    - run: git config --global user.name "Markus Binsteiner"
    - name: extract tag name
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: checkout main branch
      run: |
        if git show-ref --verify --quiet refs/heads/main; then
          git checkout main
        else
          git checkout -b main
        fi
    - name: merge tag
      run: git merge "${RELEASE_VERSION}"
    - name: push updated main branch
      run: git push https://${{ secrets.GITHUB_TOKEN }}@github.com/hostuser/berlin_events_explorer.git
